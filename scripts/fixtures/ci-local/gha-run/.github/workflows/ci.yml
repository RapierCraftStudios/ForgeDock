name: CI
on:
  pull_request:
jobs:
  first:
    runs-on: ubuntu-latest
    steps:
      - run: echo first >> "$RUN_LOG"
      - name: reads GITHUB_ENV
        run: |
          echo "FROM_STEP=carried" >> "$GITHUB_ENV"
      - run: test "$FROM_STEP" = carried
    env:
      RUN_LOG: run.log
  second:
    needs: first
    runs-on: ubuntu-latest
    steps:
      - run: echo second
  failing:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "about to fail"
          exit 3
  skippedbyneed:
    needs: failing
    runs-on: ubuntu-latest
    steps:
      - run: echo never
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo slow-ok
  broken-install:
    runs-on: ubuntu-latest
    steps:
      - run: npm ci --no-audit --registry=http://127.0.0.1:9
