name: CI

# Runs the repo's unit-test suite (`npm test` = `node --test "bin/tests/**/*.test.mjs"`)
# and every scripts/*.test.sh shell suite (`npm run test:sh`) on every PR and on
# push to staging.
#
# Closes the visibility gap identified in forge#1581: before this workflow,
# no CI job ran the suite at all, so failing tests (including CLI-breaking
# regressions) were invisible on PRs and could reach a deploy candidate
# without ever failing a check.
#
# Push to `main` is intentionally excluded here — `publish.yml` already runs
# `npm test` and `npm run test:sh` as pre-publish gates on every push to `main`. Including `main`
# here would duplicate the test run and waste CI minutes (forge#1603).
#
# These jobs are intentionally never masked or auto-passed: a red result here is
# the desired, correct signal.

on:
  pull_request:
  push:
    branches:
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (node --test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: npm test

  shell-tests:
    name: Shell tests (scripts/*.test.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # review-pr-gate2.test.sh exits 0 ("skipped") when jq is missing, so a
      # missing jq would read as green. Fail hard instead.
      - name: Require jq
        run: command -v jq || { echo "jq is required by the shell suites" >&2; exit 1; }

      - name: Run shell tests
        run: npm run test:sh
