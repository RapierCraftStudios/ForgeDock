# Build and push the pool lane image for a released version (#6166). publish.yml builds it after each release; run this by
# hand to (re)build a version whose image is missing: gh workflow run lane-image.yml -f version=1.71.1
name: Lane image

on:
  workflow_dispatch:
    inputs:
      version:
        description: ForgeDock version already on npm (e.g. 1.71.1)
        required: true

permissions:
  contents: write
  packages: write

jobs:
  lane-image:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # bash =~ on the whole string: grep is line-wise and would pass "1.2.3<newline>EVIL=1" (env injection via GITHUB_ENV)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be X.Y.Z"; exit 1; }
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: v${{ env.VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Wait for npm to serve this version
        run: |
          for i in $(seq 1 60); do
            if [ "$(npm view "forgedock@${VERSION}" version --prefer-online 2>/dev/null)" = "${VERSION}" ]; then exit 0; fi
            sleep 30
          done
          echo "::error::npm does not serve forgedock@${VERSION}"; exit 1
      - name: Compute lane image recipe hash
        id: lane
        run: echo "recipe=$(node -e "import('./bin/pool/version.mjs').then((m) => process.stdout.write(m.versionOf().image))")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push lane image (linux/amd64)
        id: lane_push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: pool/image
          platforms: linux/amd64
          push: true
          build-args: |
            FORGEDOCK_VERSION=${{ env.VERSION }}
            FORGEDOCK_RECIPE=${{ steps.lane.outputs.recipe }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/rapiercraftstudios/forgedock-lane:${{ env.VERSION }}
            ghcr.io/rapiercraftstudios/forgedock-lane:r-${{ steps.lane.outputs.recipe }}
          cache-from: type=gha,scope=lane-image
          cache-to: type=gha,mode=max,scope=lane-image
      - name: Check the lane image is publicly pullable
        run: |
          docker logout ghcr.io
          docker pull "ghcr.io/rapiercraftstudios/forgedock-lane:${VERSION}" >/dev/null \
            || echo "::warning::not anonymously pullable yet: set the ghcr package forgedock-lane public (org Packages > forgedock-lane > Package settings)"
      - name: Record the lane image digest (lane-image.json release asset)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.lane_push.outputs.digest }}
          RECIPE: ${{ steps.lane.outputs.recipe }}
        run: |
          # #6185: agents pull the lane image by this digest, not by the mutable version tag.
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::lane_push produced no sha256 digest"; exit 1; }
          printf '{"version":"%s","recipe":"%s","digest":"%s"}\n' "$VERSION" "$RECIPE" "$DIGEST" > lane-image.json
          cat lane-image.json
          TAG="lane-image-v${VERSION}"
          gh release create "$TAG" lane-image.json --repo "$GITHUB_REPOSITORY" --title "Lane image ${VERSION}" --notes "ghcr.io/rapiercraftstudios/forgedock-lane@${DIGEST}" \
            || gh release upload "$TAG" lane-image.json --repo "$GITHUB_REPOSITORY" --clobber
          echo "### Lane image ${VERSION}: ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
