name: Deploy Version Guard

# The guard protects squash merges into main from replacing a newer published
# package.json version with stale PR-head content. A pull_request run checks the
# current refs directly. publish.yml dispatches the same workflow after main
# advances so an older green result cannot remain merge-valid.

on:
  # This privileged event is safe here because the workflow never checks out or
  # executes PR code; it reads immutable package blobs through the GitHub API.
  # Unlike pull_request, its token can publish the required status for fork PRs.
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR targeting main to revalidate
        required: true
        type: string
      expected_head_sha:
        description: PR head SHA observed before dispatch
        required: true
        type: string
      expected_base_sha:
        description: main SHA that caused this revalidation
        required: true
        type: string

concurrency:
  # A PR-keyed group prevents publisher fan-out and pull_request runs from
  # racing. The exact-head and current-ref checks below are still required:
  # cancellation is cooperative and cannot itself prevent a stale write.
  group: version-guard-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  statuses: write

env:
  STATUS_CONTEXT: forgedock/version-guard

jobs:
  version-guard:
    name: Check package.json version is not regressing
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.base.ref == 'main'

    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Resolve current PR and refs
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha || '' }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number; refusing to publish a status for an unknown target."
            {
              echo "stale=true"
              echo "reason=invalid PR number"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_JSON=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")
          PR_STATE=$(jq -r '.state // ""' <<<"$PR_JSON")
          BASE_REF=$(jq -r '.base.ref // ""' <<<"$PR_JSON")
          HEAD_SHA=$(jq -r '.head.sha // ""' <<<"$PR_JSON")
          PR_BASE_SHA=$(jq -r '.base.sha // ""' <<<"$PR_JSON")
          MAIN_SHA=$(gh api "repos/${REPOSITORY}/branches/main" --jq '.commit.sha // empty')

          STALE=false
          REASON=""
          if [ "$PR_STATE" != "open" ] || [ "$BASE_REF" != "main" ]; then
            STALE=true
            REASON="PR is not an open PR targeting main"
          elif ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            STALE=true
            REASON="GitHub returned an invalid PR head or main SHA"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && {
            [ "$EXPECTED_HEAD_SHA" != "$HEAD_SHA" ] ||
            [ "$EXPECTED_BASE_SHA" != "$MAIN_SHA" ];
          }; then
            # A newer head or main push owns the status now. Do not even write
            # pending for this stale dispatch: otherwise an old queued run could
            # overwrite a newer success with a misleading pending result.
            STALE=true
            REASON="dispatch inputs no longer match the current PR head and main"
          fi

          {
            echo "pr_number=$PR_NUMBER"
            echo "head_sha=$HEAD_SHA"
            echo "base_sha=$MAIN_SHA"
            echo "pr_base_sha=$PR_BASE_SHA"
            echo "stale=$STALE"
            echo "reason=$REASON"
          } >> "$GITHUB_OUTPUT"

      - name: Mark current PR head pending
        if: steps.resolve.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=pending \
            -f context="${STATUS_CONTEXT}" \
            -f description="Waiting for current main version guard result for PR #${PR_NUMBER}" \
            -f target_url="${RUN_URL}"

      - name: Read package metadata at exact refs
        id: read
        if: steps.resolve.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -u

          read_package() {
            local ref="$1"
            local destination="$2"
            local encoded

            if ! encoded=$(gh api "repos/${REPOSITORY}/contents/package.json?ref=${ref}" --jq '.content // empty' 2>/dev/null); then
              printf '{}\n' > "$destination"
              return 1
            fi
            if ! printf '%s' "$encoded" | tr -d '\r\n' | base64 --decode > "$destination" 2>/dev/null; then
              printf '{}\n' > "$destination"
              return 1
            fi
            return 0
          }

          FETCH_FAILED=0
          read_package "$BASE_SHA" "${RUNNER_TEMP}/base-package.json" || FETCH_FAILED=1
          read_package "$HEAD_SHA" "${RUNNER_TEMP}/head-package.json" || FETCH_FAILED=1
          echo "fetch_failed=${FETCH_FAILED}" >> "$GITHUB_OUTPUT"

      - name: Compare head against current main
        id: compare
        if: steps.resolve.outputs.stale != 'true'
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -u
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const output = process.env.GITHUB_OUTPUT;
          const dir = process.env.RUNNER_TEMP;

          function parseSemver(value) {
            if (typeof value !== 'string') return null;
            const identifier = '(?:0|[1-9]\\d*|\\d*[A-Za-z-][0-9A-Za-z-]*)';
            const buildIdentifier = '[0-9A-Za-z-]+';
            const pattern = new RegExp(
              `^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)` +
              `(?:-(${identifier}(?:\\.${identifier})*))?` +
              `(?:\\+${buildIdentifier}(?:\\.${buildIdentifier})*)?$`,
            );
            const match = value.match(pattern);
            if (!match) return null;
            return {
              core: match.slice(1, 4).map(Number),
              prerelease: match[4] ? match[4].split('.') : [],
            };
          }

          function compare(left, right) {
            for (let index = 0; index < 3; index += 1) {
              if (left.core[index] !== right.core[index]) {
                return left.core[index] - right.core[index];
              }
            }
            if (left.prerelease.length === 0 || right.prerelease.length === 0) {
              return right.prerelease.length - left.prerelease.length;
            }
            const count = Math.max(left.prerelease.length, right.prerelease.length);
            for (let index = 0; index < count; index += 1) {
              const leftId = left.prerelease[index];
              const rightId = right.prerelease[index];
              if (leftId === undefined) return -1;
              if (rightId === undefined) return 1;
              if (leftId === rightId) continue;
              const leftNumeric = /^\\d+$/.test(leftId);
              const rightNumeric = /^\\d+$/.test(rightId);
              if (leftNumeric && rightNumeric) return Number(leftId) - Number(rightId);
              if (leftNumeric !== rightNumeric) return leftNumeric ? -1 : 1;
              return leftId < rightId ? -1 : 1;
            }
            return 0;
          }

          function result(state, reason) {
            fs.appendFileSync(output, `state=${state}\nreason=${reason.replace(/[\r\n]/g, ' ')}\n`);
          }

          let base;
          let head;
          try {
            base = JSON.parse(fs.readFileSync(path.join(dir, 'base-package.json'), 'utf8'));
          } catch (error) {
            console.error(`Deploy Version Guard FAILED — could not parse main package.json as JSON: ${error.message}`);
            result('failure', 'main package.json is not valid JSON');
            process.exit(0);
          }
          try {
            head = JSON.parse(fs.readFileSync(path.join(dir, 'head-package.json'), 'utf8'));
          } catch (error) {
            console.error(`Deploy Version Guard FAILED — could not parse PR package.json as JSON: ${error.message}`);
            result('failure', 'PR head package.json is not valid JSON');
            process.exit(0);
          }

          const baseVersion = base.version;
          const headVersion = head.version;
          const baseParsed = parseSemver(baseVersion);
          const headParsed = parseSemver(headVersion);
          if (!baseParsed || !headParsed) {
            console.error('Deploy Version Guard FAILED — both package.json version fields must be valid semver.');
            result('failure', 'package.json version is missing or invalid semver');
            process.exit(0);
          }

          console.log(`Base (main) package.json version: ${baseVersion}`);
          console.log(`Head (PR)  package.json version: ${headVersion}`);
          if (compare(headParsed, baseParsed) < 0) {
            console.error(`Deploy Version Guard FAILED — PR head version ${headVersion} is lower than main ${baseVersion}.`);
            result('failure', `head version ${headVersion} is lower than main ${baseVersion}`);
          } else {
            console.log('Deploy Version Guard passed — head version is not a regression from main.');
            result('success', `head version ${headVersion} is current against main ${baseVersion}`);
          }
          NODE

      - name: Revalidate refs before final status
        id: verify
        if: always() && steps.resolve.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
        run: |
          set -u
          CURRENT_HEAD_SHA=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha // empty' 2>/dev/null || true)
          CURRENT_BASE_SHA=$(gh api "repos/${REPOSITORY}/branches/main" --jq '.commit.sha // empty' 2>/dev/null || true)
          if [ "$CURRENT_HEAD_SHA" != "$EXPECTED_HEAD_SHA" ] || [ "$CURRENT_BASE_SHA" != "$EXPECTED_BASE_SHA" ]; then
            echo "Current refs changed while the guard was evaluating; leaving the pending status for the newer run."
            {
              echo "stale=true"
              echo "reason=PR head or main changed during evaluation"
            } >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish final freshness status
        if: always() && steps.resolve.outputs.stale != 'true' && steps.verify.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          GUARD_STATE: ${{ steps.compare.outputs.state }}
          GUARD_REASON: ${{ steps.compare.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          FINAL_STATE="${GUARD_STATE:-failure}"
          if [ "$FINAL_STATE" != "success" ] && [ "$FINAL_STATE" != "failure" ]; then
            FINAL_STATE=failure
          fi
          DESCRIPTION="${GUARD_REASON:-guard could not evaluate its inputs}"
          gh api "repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$FINAL_STATE" \
            -f context="${STATUS_CONTEXT}" \
            -f description="$DESCRIPTION" \
            -f target_url="${RUN_URL}"

          # Close the final-write TOCTOU window. If either ref changed before
          # this post-write read, restore pending so this obsolete run cannot
          # overwrite the publisher's invalidation with stale success. If the
          # ref changes after these reads, the publisher's later pending write
          # wins instead.
          if [ "$FINAL_STATE" = "success" ]; then
            CURRENT_HEAD_SHA=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha // empty' 2>/dev/null || true)
            CURRENT_BASE_SHA=$(gh api "repos/${REPOSITORY}/branches/main" --jq '.commit.sha // empty' 2>/dev/null || true)
            if [ "$CURRENT_HEAD_SHA" != "$HEAD_SHA" ] || [ "$CURRENT_BASE_SHA" != "${{ steps.resolve.outputs.base_sha }}" ]; then
              gh api "repos/${REPOSITORY}/statuses/${HEAD_SHA}" \
                -f state=pending \
                -f context="${STATUS_CONTEXT}" \
                -f description="Refs changed after evaluation; waiting for current revalidation" \
                -f target_url="${RUN_URL}"
              echo "Refs changed during final publication; stale success was restored to pending."
              exit 1
            fi
          fi
          if [ "$FINAL_STATE" != "success" ]; then
            exit 1
          fi

      - name: Report stale run without overwriting newer status
        if: always() && (steps.resolve.outputs.stale == 'true' || steps.verify.outputs.stale == 'true')
        run: |
          echo "Guard run became stale; a newer PR-head or main commit owns the required status."
