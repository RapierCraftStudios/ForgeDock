name: Deploy Gate Marker Check

# Verifies that staging→main PRs have a FORGE:GATE_PASS or FORGE:GATE_FAILURE
# marker comment before merge is allowed. Closes the bypass-detection gap
# identified in forge#1387: without this check, a spec bypass (agent never ran
# review-pr-staging) is indistinguishable from a clean gate pass because both
# previously left no comment.
#
# Trigger: pull_request targeting main (staging→main deploy PRs only).
# Non-staging→main PRs are skipped immediately (the gate only applies to deploy PRs).
#
# Gate logic: the gate is the `forge/deploy-gate` commit status on the PR head,
# not this job's own check run. An issue_comment run reports against the default
# branch, so only a commit status can follow a marker posted after the PR opened.
#   - latest trusted marker is FORGE:GATE_PASS    → status success
#   - latest trusted marker is FORGE:GATE_FAILURE → status failure (a re-run that
#     passes posts a newer GATE_PASS, which wins)
#   - no trusted marker                           → status pending, at any age
# The job's own result is not the gate: within 30 minutes of the PR opening it
# exits 0 with no marker, so the staging review's CI read (Phase 1E) is not
# blocked by the gate it is about to satisfy. Make `forge/deploy-gate` a required
# status check on main to block the merge (docs/CI.md). Before this status, that
# early green job was the only signal, and marker comments from the bot
# (association CONTRIBUTOR) never re-ran it, so it stood for any PR merged later.
#
# Trust model: a gate marker only counts if its author's GitHub login appears in
# the `FORGE_TRUSTED_MARKER_AUTHORS` repository variable (Settings → Actions →
# Variables → New repository variable), a comma-separated allowlist of logins
# that legitimately run /review-pr-staging. An arbitrary commenter (e.g. an
# external contributor who can comment but is not in the allowlist) cannot
# forge a passing gate by hand-typing the marker text.
#
# issue_comment trigger restriction: the job only runs for issue_comment events
# where the commenter has OWNER, MEMBER, or COLLABORATOR author_association.
# This prevents untrusted external contributors (association: CONTRIBUTOR,
# FIRST_TIMER, FIRST_TIME_CONTRIBUTOR, NONE) from triggering the workflow via
# any comment on any PR, which would waste CI minutes and exercise the
# statuses:write permission surface unnecessarily. <!-- Added: forge#1661 -->
#
# IMPORTANT — operator setup required: if `FORGE_TRUSTED_MARKER_AUTHORS` is
# unset or empty, NO marker is trusted and every staging→main PR will be
# treated as a gate bypass after the 30-minute window. Set this variable to
# the GitHub login(s) that run /review-pr-staging before relying on this gate.
#
# Why a repo variable and not a live permission-API lookup: GET
# /repos/{owner}/{repo}/collaborators/{username}/permission requires push/admin
# access from the calling token, which the default GITHUB_TOKEN does not have
# under this workflow's minimal `permissions:` block — and there is no
# `administration` scope available in the `permissions:` key to grant it. A
# lookup-based design would fail closed on every author, permanently blocking
# all staging→main deploys. Reading `vars.*` requires no extra token scope, so
# the allowlist is the reliable mechanism.
#
# Residual risk (accepted, out of scope): an account already in the allowlist
# could still forge its own marker — that account already has push/merge
# rights and this check cannot constrain it further.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
  issue_comment:
    types: [created]

permissions:
  pull-requests: read
  contents: read
  statuses: write

jobs:
  gate-marker-check:
    name: Check for FORGE gate markers
    runs-on: ubuntu-latest

    # Only run on PRs targeting main — skip all other PR events.
    # For issue_comment events, additionally require that the commenter has
    # OWNER, MEMBER, or COLLABORATOR association to prevent untrusted external
    # contributors from triggering the workflow (and exercising statuses:write)
    # via arbitrary comments on any PR. <!-- Added: forge#1661 -->
    # A gate-marker comment from an allowlisted login also runs it: the bot that
    # posts markers has association CONTRIBUTOR. `contains` on the variable is a
    # substring test, which only decides whether the job runs; the scan step
    # trusts a marker on an exact login match.
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
        (contains(github.event.comment.body, '<!-- FORGE:GATE_') &&
         vars.FORGE_TRUSTED_MARKER_AUTHORS != '' &&
         contains(vars.FORGE_TRUSTED_MARKER_AUTHORS, github.event.comment.user.login))))

    steps:
      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER_CTX: ${{ github.event.pull_request.number }}
          PR_BASE_CTX: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_CTX: ${{ github.event.pull_request.head.ref }}
          PR_CREATED_CTX: ${{ github.event.pull_request.created_at }}
          PR_SHA_CTX: ${{ github.event.pull_request.head.sha }}
          ISSUE_NUMBER_CTX: ${{ github.event.issue.number }}
          REPO_CTX: ${{ github.repository }}
        run: |
          # Sanitize all values written to GITHUB_OUTPUT by stripping newline and
          # carriage-return characters. Branch refs and timestamps from the PR event
          # payload are attacker-controlled for PRs from forked repos — a value
          # containing '\n' would inject arbitrary key=value pairs into GITHUB_OUTPUT,
          # potentially overriding outputs consumed by downstream steps (e.g. injecting
          # skip=false to bypass the non-deploy-PR guard). <!-- Added: forge#1660 -->
          sanitize() { printf '%s' "$1" | tr -d '\n\r'; }

          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "number=$(sanitize "$PR_NUMBER_CTX")" >> "$GITHUB_OUTPUT"
            echo "base=$(sanitize "$PR_BASE_CTX")" >> "$GITHUB_OUTPUT"
            echo "head=$(sanitize "$PR_HEAD_CTX")" >> "$GITHUB_OUTPUT"
            echo "created_at=$(sanitize "$PR_CREATED_CTX")" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(sanitize "$PR_SHA_CTX")" >> "$GITHUB_OUTPUT"
          else
            # issue_comment event — fetch PR details via API
            PR_DATA=$(gh pr view "$ISSUE_NUMBER_CTX" \
              --repo "$REPO_CTX" \
              --json number,baseRefName,headRefName,createdAt,headRefOid \
              --jq '{number:.number,base:.baseRefName,head:.headRefName,created_at:.createdAt,head_sha:.headRefOid}')
            echo "number=$(echo "$PR_DATA" | jq -r '.number' | tr -d '\n\r')" >> "$GITHUB_OUTPUT"
            echo "base=$(echo "$PR_DATA" | jq -r '.base' | tr -d '\n\r')" >> "$GITHUB_OUTPUT"
            echo "head=$(echo "$PR_DATA" | jq -r '.head' | tr -d '\n\r')" >> "$GITHUB_OUTPUT"
            echo "created_at=$(echo "$PR_DATA" | jq -r '.created_at' | tr -d '\n\r')" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(echo "$PR_DATA" | jq -r '.head_sha' | tr -d '\n\r')" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip non-deploy PRs
        id: scope
        env:
          BASE: ${{ steps.pr.outputs.base }}
          HEAD: ${{ steps.pr.outputs.head }}
        run: |
          # Gate only applies to staging→main or feature→main deploy PRs
          if [ "$BASE" != "main" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "PR base is '$BASE' (not main) — gate-marker-check does not apply."
          elif [ "$HEAD" != "staging" ] && [ "$HEAD" != "feature" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "PR head is '$HEAD' (not staging/feature) — gate-marker-check does not apply."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Deploy PR detected: $HEAD → $BASE. Running gate-marker-check."
          fi

      - name: Check FORGE_TRUSTED_MARKER_AUTHORS configured
        id: vars_check
        if: steps.scope.outputs.skip == 'false'
        env:
          TRUSTED_AUTHORS_RAW: ${{ vars.FORGE_TRUSTED_MARKER_AUTHORS }}
        run: |
          # Fail immediately with actionable guidance when the required repo variable
          # is unset or empty. Without this check the gate silently accepts no markers,
          # waits 30 minutes, then fails with a cryptic "gate bypass" error — giving
          # operators no indication that a one-time variable setup is required.
          # <!-- Added: forge#1663 -->
          TRUSTED_LIST=$(echo "$TRUSTED_AUTHORS_RAW" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$' || true)
          if [ -z "$TRUSTED_LIST" ]; then
            echo "⛔ SETUP REQUIRED: FORGE_TRUSTED_MARKER_AUTHORS repository variable is not configured."
            echo ""
            echo "This variable is required before the deploy gate can function. Without it, no"
            echo "gate marker author can be trusted and every staging→main PR will be blocked."
            echo ""
            echo "How to fix:"
            echo "  1. Go to: Settings → Secrets and variables → Actions → Variables → New repository variable"
            echo "  2. Name:  FORGE_TRUSTED_MARKER_AUTHORS"
            echo "  3. Value: comma-separated list of GitHub logins that run /review-pr-staging"
            echo "            Example: rapiercraft-forgedock[bot],your-login"
            echo ""
            echo "After setting the variable, re-run this check (push a commit or re-run the workflow)."
            exit 1
          fi
          echo "FORGE_TRUSTED_MARKER_AUTHORS is set (${#TRUSTED_LIST} chars). Proceeding."

      - name: Scan PR comments for gate markers
        id: scan
        if: steps.scope.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          TRUSTED_AUTHORS_RAW: ${{ vars.FORGE_TRUSTED_MARKER_AUTHORS }}
        run: |
          # Fetch PR comments and review comments as {login, body} JSON — author
          # identity MUST travel with the body so a marker can be attributed to
          # its actual author before it is trusted (see "Trust model" note above).
          COMMENTS_JSON=$(gh pr view "$PR_NUMBER" \
            --repo "$REPO" \
            --json comments \
            --jq '.comments' 2>/dev/null || echo "[]")

          REVIEWS_JSON=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" 2>/dev/null || echo "[]")

          # Use the real `jq` binary (not gh's --jq) with -c so every item is
          # guaranteed to be exactly one line, regardless of body content.
          ALL_ITEMS=$(
            {
              echo "$COMMENTS_JSON" | jq -c '.[] | {at: (.createdAt // ""), login: (.author.login // ""), body: (.body // "")}' 2>/dev/null
              echo "$REVIEWS_JSON"  | jq -c '.[] | {at: (.submitted_at // ""), login: (.user.login // ""), body: (.body // "")}' 2>/dev/null
            } | jq -sc 'sort_by(.at) | .[]' 2>/dev/null || true
          )

          # Normalize the comma-separated allowlist (repo variable) into one
          # trimmed login per line. No GitHub API call and no extra token scope
          # is needed — `vars.*` is resolved by the Actions runtime itself.
          TRUSTED_LIST=$(echo "$TRUSTED_AUTHORS_RAW" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$' || true)

          if [ -z "$TRUSTED_LIST" ]; then
            echo "WARNING: FORGE_TRUSTED_MARKER_AUTHORS repo variable is unset or empty — no marker author can be trusted, every PR will be treated as a gate bypass. Configure this variable (Settings → Actions → Variables) with the login(s) that run /review-pr-staging."
          fi

          is_trusted_author() {
            local login="$1"
            if [ -z "$login" ] || [ -z "$TRUSTED_LIST" ]; then
              return 1
            fi
            echo "$TRUSTED_LIST" | grep -qxF "$login"
          }

          GATE_PASS=0
          GATE_FAILURE=0
          SPEC_LOADED=0
          # Items are in time order, so LATEST ends as the newest trusted marker:
          # a GATE_FAILURE after a GATE_PASS blocks, a re-run's GATE_PASS after a
          # GATE_FAILURE clears it. A body carrying both counts as a failure.
          LATEST=none

          while IFS= read -r ITEM; do
            if [ -z "$ITEM" ]; then
              continue
            fi
            LOGIN=$(echo "$ITEM" | jq -r '.login' 2>/dev/null || echo "")
            BODY=$(echo "$ITEM" | jq -r '.body' 2>/dev/null || echo "")

            if echo "$BODY" | grep -q '<!-- FORGE:GATE_PASS'; then
              if is_trusted_author "$LOGIN"; then
                GATE_PASS=$((GATE_PASS + 1))
                LATEST=pass
              else
                echo "Ignoring FORGE:GATE_PASS marker from untrusted author '$LOGIN' (not in FORGE_TRUSTED_MARKER_AUTHORS)."
              fi
            fi
            if echo "$BODY" | grep -q '<!-- FORGE:GATE_FAILURE'; then
              if is_trusted_author "$LOGIN"; then
                GATE_FAILURE=$((GATE_FAILURE + 1))
                LATEST=failure
              else
                echo "Ignoring FORGE:GATE_FAILURE marker from untrusted author '$LOGIN' (not in FORGE_TRUSTED_MARKER_AUTHORS)."
              fi
            fi
            if echo "$BODY" | grep -q '<!-- FORGE:SPEC_LOADED'; then
              if is_trusted_author "$LOGIN"; then
                SPEC_LOADED=$((SPEC_LOADED + 1))
              else
                echo "Ignoring FORGE:SPEC_LOADED marker from untrusted author '$LOGIN' (not in FORGE_TRUSTED_MARKER_AUTHORS)."
              fi
            fi
          done <<< "$ALL_ITEMS"

          echo "gate_pass=$GATE_PASS" >> "$GITHUB_OUTPUT"
          echo "gate_failure=$GATE_FAILURE" >> "$GITHUB_OUTPUT"
          echo "spec_loaded=$SPEC_LOADED" >> "$GITHUB_OUTPUT"

          if [ "$LATEST" = "pass" ]; then
            echo "marker_found=pass" >> "$GITHUB_OUTPUT"
            echo "Latest trusted gate marker is FORGE:GATE_PASS ($GATE_PASS pass, $GATE_FAILURE failure in all) — gate ran and passed."
          elif [ "$LATEST" = "failure" ]; then
            echo "marker_found=failure" >> "$GITHUB_OUTPUT"
            echo "Latest trusted gate marker is FORGE:GATE_FAILURE ($GATE_PASS pass, $GATE_FAILURE failure in all) — gate ran and BLOCKED deploy."
          else
            echo "marker_found=none" >> "$GITHUB_OUTPUT"
            echo "No trusted FORGE gate marker found on PR #$PR_NUMBER."
          fi

      - name: Check 30-minute window
        id: window
        if: |
          steps.scope.outputs.skip == 'false' &&
          steps.scan.outputs.marker_found == 'none'
        env:
          PR_CREATED: ${{ steps.pr.outputs.created_at }}
        run: |
          NOW=$(date -u +%s)
          # Validate PR_CREATED is ISO 8601 (YYYY-MM-DDTHH:MM:SSZ) before passing to date -d.
          # An unvalidated date string could cause date -d to interpret relative or
          # malformed values, producing an unexpected epoch and corrupting the stale
          # calculation. If the format guard fails, default to epoch 0 (fail-closed:
          # ELAPSED becomes very large → stale=true). <!-- Added: forge#1664 -->
          if echo "$PR_CREATED" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'; then
            PR_EPOCH=$(date -u -d "$PR_CREATED" +%s 2>/dev/null || date -u -j -f "%Y-%m-%dT%H:%M:%SZ" "$PR_CREATED" +%s 2>/dev/null || echo 0)
          else
            echo "WARNING: PR created_at '$PR_CREATED' does not match expected ISO 8601 format (YYYY-MM-DDTHH:MM:SSZ) — defaulting to epoch 0 (treating as stale)."
            PR_EPOCH=0
          fi
          ELAPSED=$(( NOW - PR_EPOCH ))
          WINDOW=1800  # 30 minutes in seconds

          echo "PR created: $PR_CREATED (epoch: $PR_EPOCH)"
          echo "Now: $NOW, Elapsed: ${ELAPSED}s, Window: ${WINDOW}s"

          if [ "$ELAPSED" -gt "$WINDOW" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "PR is older than 30 minutes with no gate marker — treating as bypass."
          else
            REMAINING=$(( WINDOW - ELAPSED ))
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "remaining_seconds=$REMAINING" >> "$GITHUB_OUTPUT"
            echo "PR is within the 30-minute window (${ELAPSED}s elapsed, ${REMAINING}s remaining). Gate may still be running."
          fi

      - name: Evaluate gate result
        if: steps.scope.outputs.skip == 'false'
        env:
          MARKER: ${{ steps.scan.outputs.marker_found }}
          STALE: ${{ steps.window.outputs.stale }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SPEC_LOADED: ${{ steps.scan.outputs.spec_loaded }}
          REMAINING: ${{ steps.window.outputs.remaining_seconds }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The gate is this commit status on the PR head (see "Gate logic" above).
          # A missing head SHA or a failed POST fails the job: the status is the gate.
          set_status() {
            if ! echo "$HEAD_SHA" | grep -qE '^[0-9a-f]{40}$'; then
              echo "⛔ PR head SHA unreadable ('$HEAD_SHA') — cannot report forge/deploy-gate."
              exit 1
            fi
            gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" \
              -f state="$1" -f context="forge/deploy-gate" -f description="$2" -f target_url="$RUN_URL" >/dev/null \
              || { echo "⛔ Could not post the forge/deploy-gate status on $HEAD_SHA."; exit 1; }
            echo "forge/deploy-gate → $1 on $HEAD_SHA: $2"
          }

          if [ "$MARKER" = "pass" ]; then
            set_status success "Latest trusted gate marker: FORGE:GATE_PASS"
            echo "✅ FORGE:GATE_PASS found — deploy gates ran and passed. PR #$PR_NUMBER is cleared for merge."
            exit 0
          fi

          if [ "$MARKER" = "failure" ]; then
            set_status failure "Latest trusted gate marker: FORGE:GATE_FAILURE"
            echo "⛔ FORGE:GATE_FAILURE found — deploy gate BLOCKED this PR."
            echo ""
            echo "The /review-pr-staging command ran and a deploy gate blocked this PR."
            echo "Fix the blocking issue, then re-run the staging review."
            exit 1
          fi

          # No marker found: the status stays pending (never success) at any age.
          if [ "$STALE" = "true" ]; then
            set_status pending "No trusted gate marker after 30 min: run /review-pr-staging"
            echo "⛔ GATE BYPASS DETECTED — No FORGE gate marker found on PR #$PR_NUMBER after 30 minutes."
            echo ""
            echo "A staging→main deploy PR MUST have a FORGE:GATE_PASS or FORGE:GATE_FAILURE comment"
            echo "posted by /review-pr-staging before merge is permitted."
            echo ""
            echo "Possible causes:"
            echo "  1. The /review-pr-staging command was never run for this PR."
            echo "  2. The agent improvised instead of following the spec (spec bypass)."
            echo "  3. The review ran but was interrupted before Phase 0A completed."
            echo ""
            if [ "${SPEC_LOADED:-0}" = "0" ]; then
              echo "  ⚠️  FORGE:SPEC_LOADED marker is also absent — strong evidence the spec was never loaded."
            fi
            echo ""
            echo "Resolution: Run /review-pr $PR_NUMBER (or /review-pr staging) to complete the review."
            echo "forge/deploy-gate stays pending until a trusted marker is posted."
            exit 1
          else
            set_status pending "Waiting for a trusted FORGE gate marker from /review-pr-staging"
            echo "⏳ No gate marker yet — within 30-minute window (${REMAINING}s remaining)."
            echo ""
            echo "The /review-pr-staging spec posts gate markers during Phase 0A (open-review-finding gate)"
            echo "and Phase 6.5 (runtime test gate). If the review is still in progress, this check"
            echo "turns green once a marker is posted: forge/deploy-gate stays pending until then."
            echo ""
            echo "If the review has already completed with no marker, re-run it."
            # Exit 0: a red job would block the staging review's own CI read (Phase 1E).
            # The pending forge/deploy-gate status, not this job, holds the merge.
            exit 0
          fi
