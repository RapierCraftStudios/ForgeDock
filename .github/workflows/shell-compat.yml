name: Shell Compatibility

# Runs shellcheck on .sh files and validates portability on macOS and Windows.
# Prevents reintroduction of GNU-only shell constructs (grep -P, date -d epoch,
# GNU sed extensions) that silently fail on macOS BSD tools or Windows bash.
#
# Trigger rules:
#   pull_request / push: path-gated to .sh files and .github/workflows/
#
# Background: grep -oP (PCRE) has been reintroduced 4 times (#786, #811, #1179,
# #1608). This workflow catches it at CI rather than at code review. <!-- Added: forge#1608 -->

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'commands/**'
      - '.github/workflows/**'
      - '.github/workflows/shell-compat.yml'
  push:
    branches:
      - staging
      - main
    paths:
      - 'scripts/**'
      - 'commands/**'
      - '.github/workflows/**'
      - '.github/workflows/shell-compat.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Dispatch prompt lint fixtures (forge#3072) — keep the Hard Rule 1 lint tested
  # ---------------------------------------------------------------------------
  dispatch-lint-tests:
    name: lint-dispatch-prompt fixtures (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned (not macos-latest) so the runner image/awk/sed do not float silently.
        # NOTE: the fixtures run under whichever `bash` resolves first on PATH (system or
        # Homebrew); the "Show resolved bash" step logs which one. Keep the script free of
        # bash-4+ constructs so it also works under the older system bash 3.2.
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Show resolved bash
        run: |
          command -v bash
          bash --version | head -1
      - name: Assert bash 3.2 compatibility (macOS system bash)
        if: runner.os == 'macOS'
        run: |
          /bin/bash --version | head -1
          /bin/bash --version | head -1 | grep -q 'version 3\.2' || { echo "::error::/bin/bash is not 3.2"; exit 1; }
          /bin/bash scripts/lint-dispatch-prompt.test.sh
          /bin/bash scripts/lint-build-validate-files.test.sh
          /bin/bash scripts/verify-phase-trail.test.sh
          /bin/bash scripts/classify-finding.test.sh
          /bin/bash scripts/amplification-breaker.test.sh
          /bin/bash scripts/check-spec-bash.test.sh
      # macOS runs lint-dispatch-prompt/verify-phase-trail once, under /bin/bash 3.2 above.
      - name: Run lint-dispatch-prompt.test.sh
        if: runner.os != 'macOS'
        run: |
          bash scripts/lint-dispatch-prompt.test.sh
          bash scripts/lint-build-validate-files.test.sh
      - name: Run forge-root.test.sh
        run: bash scripts/forge-root.test.sh
      - name: Run forge-root.test.sh bootstrap under zsh (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v zsh && zsh --version
          FORGE_ROOT_TEST_SHELLS="bash zsh" /bin/bash scripts/forge-root.test.sh
      - name: Run verify-phase-trail.test.sh
        if: runner.os != 'macOS'
        run: bash scripts/verify-phase-trail.test.sh
      - name: Run classify-finding.test.sh and amplification-breaker.test.sh
        run: |
          bash scripts/classify-finding.test.sh
          bash scripts/amplification-breaker.test.sh
          bash scripts/check-spec-bash.test.sh
      - name: Run is-docs-only.test.sh
        run: bash scripts/is-docs-only.test.sh
      - name: Run spawn-depth-check.test.sh
        run: bash scripts/spawn-depth-check.test.sh
      - name: Run extract-affected-files.test.sh
        run: bash scripts/extract-affected-files.test.sh
      - name: Run wait-ci-green.test.sh
        run: bash scripts/wait-ci-green.test.sh

  # ---------------------------------------------------------------------------
  # Windows Git Bash fixture smoke for the phase-trail / dispatch-lint scripts
  # (forge#3101). Non-blocking: surfaces Windows-specific failures without gating merges.
  # The fixtures mock `gh` on PATH but need `jq`.
  # ---------------------------------------------------------------------------
  windows-fixture-smoke:
    name: Windows fixture smoke (Git Bash)
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Ensure jq is available
        run: command -v jq || choco install jq --version 1.7.1 -y --no-progress
      - name: Run forge-root.test.sh
        run: bash scripts/forge-root.test.sh
      - name: Run lint-dispatch-prompt.test.sh
        run: |
          bash scripts/lint-dispatch-prompt.test.sh
          bash scripts/lint-build-validate-files.test.sh
      - name: Run verify-phase-trail.test.sh
        run: bash scripts/verify-phase-trail.test.sh
      - name: Run classify-finding.test.sh and amplification-breaker.test.sh
        run: |
          bash scripts/classify-finding.test.sh
          bash scripts/amplification-breaker.test.sh
          bash scripts/check-spec-bash.test.sh
      - name: Run is-docs-only.test.sh
        run: bash scripts/is-docs-only.test.sh
      - name: Run spawn-depth-check.test.sh
        run: bash scripts/spawn-depth-check.test.sh

  # ---------------------------------------------------------------------------
  # Job 1: shellcheck — static analysis for .sh files on Linux
  # ---------------------------------------------------------------------------
  shellcheck:
    name: shellcheck (.sh files)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run shellcheck on all .sh scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: './scripts'
          severity: error
          # SC2086: double-quote to prevent word splitting — ERROR level
          # SC2031: var was modified in a subshell (WARNINGS subclass) — ERROR level
          # SC2034: var appears unused — WARNING level (not blocking here)
          check_together: 'yes'
        env:
          SHELLCHECK_OPTS: '-e SC2034'

  # ---------------------------------------------------------------------------
  # Job 2: portability smoke on macOS — verify .sh files can be parsed by BSD
  # ---------------------------------------------------------------------------
  macos-portability:
    name: macOS portability smoke
    runs-on: macos-14

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify no grep -P / grep -oP in shell scripts
        run: |
          # BSD grep on macOS does not support -P (PCRE).
          # This step hard-fails if any .sh file uses grep -P or grep -oP in executable code.
          # Exclusions:
          # - Lines that are shell comments (first non-whitespace char is #) — these document
          #   the anti-pattern and are intentionally excluded via grep -v '^\s*#'
          # - Lines containing '# allowlist:' — explicit per-line exemptions
          MATCHES=$(grep -rnE "grep\s+-[a-zA-Z]*P[ '\"]|grep\s+-oP[ '\"]|grep\s+-P[ '\"]" scripts/ \
            --include='*.sh' \
            | grep -vE ':[0-9]+:\s*#' \
            | grep -v '# allowlist:' \
            || true)
          if [ -n "$MATCHES" ]; then
            echo "ERROR: Non-portable grep -P / grep -oP found in scripts/:"
            echo "$MATCHES"
            echo ""
            echo "BSD grep (macOS) does not support -P. Use grep -E + sed instead."
            exit 1
          fi
          echo "OK: No grep -P patterns found in scripts/"

      - name: Syntax-check .sh files with bash (macOS)
        run: |
          # Scope: diff-based — only .sh files changed in this PR are syntax-checked.
          # This allows phased remediation of the existing corpus while catching new
          # syntax errors in changed scripts. <!-- scope: diff-only; see #1608 -->
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          CHANGED_SCRIPTS=$(git diff --name-only "$BASE_SHA"...HEAD -- 'scripts/**/*.sh' 2>/dev/null \
            | grep -E '\.sh$' || true)
          if [ -z "$CHANGED_SCRIPTS" ]; then
            echo "OK: No scripts/*.sh files changed in this PR — bash -n syntax check skipped."
            exit 0
          fi
          FAILED=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            bash -n "$f" 2>&1 || { echo "SYNTAX ERROR in $f"; FAILED=1; }
          done <<< "$CHANGED_SCRIPTS"
          [ "$FAILED" -eq 0 ] && echo "OK: All changed .sh files pass bash -n syntax check on macOS"
          exit "$FAILED"

  # ---------------------------------------------------------------------------
  # Job 3: portability smoke on Windows (Git Bash)
  # ---------------------------------------------------------------------------
  windows-portability:
    name: Windows portability smoke (Git Bash)
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Syntax-check .sh files with bash (Windows Git Bash)
        run: |
          # Scope: diff-based — only .sh files changed in this PR are syntax-checked.
          # Prevents blocking on pre-existing issues in unrelated scripts. <!-- scope: diff-only; see #1608 -->
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          CHANGED_SCRIPTS=$(git diff --name-only "$BASE_SHA"...HEAD -- 'scripts/**/*.sh' 2>/dev/null \
            | grep -E '\.sh$' || true)
          if [ -z "$CHANGED_SCRIPTS" ]; then
            echo "OK: No scripts/*.sh files changed in this PR — bash -n syntax check skipped."
            exit 0
          fi
          FAILED=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            bash -n "$f" 2>&1 || { echo "SYNTAX ERROR in $f"; FAILED=1; }
          done <<< "$CHANGED_SCRIPTS"
          [ "$FAILED" -eq 0 ] && echo "OK: All changed .sh files pass bash -n syntax check on Windows Git Bash"
          exit "$FAILED"

      - name: Verify no GNU date -d epoch patterns in shell scripts
        run: |
          # GNU date -d '@epoch' is not portable to macOS or Windows date.
          # Portable alternative: python3 -c "import datetime; ..."
          MATCHES=$(grep -rnE "date -d '@[0-9]|date -d \"\$" scripts/ --include='*.sh' | grep -v '# allowlist:' || true)
          if [ -n "$MATCHES" ]; then
            echo "WARNING: GNU date -d epoch pattern found (not portable to macOS/Windows):"
            echo "$MATCHES"
            echo "Use: python3 -c \"import sys,datetime; print(datetime.datetime.fromtimestamp(int(sys.argv[1])))\" \"\$EPOCH\""
            # Advisory only — does not block (date -d is less critical than grep -P)
          fi
          echo "Windows portability smoke complete."
