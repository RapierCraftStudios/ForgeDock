name: Devdocs freshness

# forge#4185: a PR that changes non-test files under bin/lean/ or scripts/ must also update the matching
# module dossier, NORTHSTAR.md's Runtime map or a decision record (scripts/check-devdocs-freshness.sh).
# It runs on EVERY pull request, with no paths filter, so it can be a required status check on staging:
# a path-filtered workflow never reports on PRs outside its paths, and a required check that never
# reports blocks the merge. A PR with no bin/lean or scripts change passes immediately.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  devdocs-freshness:
    name: Devdocs freshness (bin/lean + scripts changes update docs)
    runs-on: ubuntu-latest
    # Release PRs (staging -> main) carry cumulative changes already checked per PR.
    if: github.event_name == 'pull_request' && !(github.head_ref == 'staging' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run freshness fixtures
        run: bash scripts/check-devdocs-freshness.test.sh

      - name: Check NORTHSTAR.md pointers and devdocs selective loading
        run: bash scripts/northstar-docs.test.sh

      - name: Check bin/lean + scripts behaviour changes touch a dossier, NORTHSTAR.md Runtime map or a decision
        env:
          BASE_NAME: ${{ github.base_ref }}
          # The PR body reaches the script through env only, never interpolated into the shell.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Deterministic, no LLM (forge#4185). Exempt with a 'docs-not-needed: <reason>' line in the PR body.
          bash scripts/check-devdocs-freshness.sh "origin/${BASE_NAME}"
